name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET build, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Integration tests start RavenDB and PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, full stack)
    needs: [dotnet, web]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      # Environment variables override appsettings (and replace user secrets in CI).
      ConnectionStrings__Orders: Host=localhost;Port=5432;Database=minikobo_orders;Username=minikobo;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start the whole stack
        run: scripts/dev-up.sh
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: web
        run: npm run test:e2e
      - name: Upload report and service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            web/playwright-report
            .logs
